<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue-Moon | Sanctuary of Stories</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#131C31',
                            accent: '#3B82F6',
                            glow: '#60A5FA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos do Swipe de Coração ("Favoritei") */
        .favorite-swipe-track {
            position: relative;
            width: 100%;
            height: 44px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            touch-action: none;
        }
        .favorite-swipe-track.active-fav {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
        }
        .favorite-swipe-thumb {
            position: absolute;
            left: 3px;
            width: 38px;
            height: 38px;
            background: #1f2937;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: grab;
            transition: background 0.2s, color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        .favorite-swipe-track.active-fav .favorite-swipe-thumb {
            background: #ef4444;
            color: #ffffff;
        }
        .favorite-swipe-thumb:active {
            cursor: grabbing;
        }
        .favorite-swipe-text {
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            pointer-events: none;
        }
        .favorite-swipe-track.active-fav .favorite-swipe-text {
            color: #fca5a5;
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans min-h-screen flex flex-col selection:bg-brand-accent selection:text-white">

    <!-- HEADER / AUTENTICAÇÃO -->
    <header class="border-b border-slate-800 bg-brand-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-moon text-brand-glow text-2xl"></i>
                <h1 class="font-cinzel font-bold text-xl tracking-wider bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">Blue-Moon</h1>
            </div>
            <div id="auth-container" class="flex items-center space-x-4">
                <span id="user-greeting" class="text-sm text-slate-300 hidden">Olá, <span id="user-name" class="font-semibold text-white"></span></span>
                <button id="auth-btn" class="bg-brand-accent hover:bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-blue-500/20">
                    <i class="fa-brands fa-google mr-2"></i>Entrar com Google
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-3xl font-cinzel font-bold mb-2">Sanctuary of Stories</h2>
                <p class="text-slate-400 text-sm">Explore o seu acervo pessoal com o novo controlo de favoritos.</p>
            </div>
            <button onclick="openAddModal()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium px-5 py-2.5 rounded-xl shadow-lg shadow-blue-600/20 transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Adicionar Obra</span>
            </button>
        </div>

        <!-- ESTATÍSTICAS -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Total</p>
                <p id="stat-total" class="text-2xl font-bold text-white">0</p>
            </div>
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Concluídos</p>
                <p id="stat-completed" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Em Andamento</p>
                <p id="stat-progress" class="text-2xl font-bold text-amber-400">0</p>
            </div>
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Planeados</p>
                <p id="stat-planned" class="text-2xl font-bold text-blue-400">0</p>
            </div>
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Abandonados</p>
                <p id="stat-dropped" class="text-2xl font-bold text-rose-400">0</p>
            </div>
            <div class="bg-brand-card border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Favoritos</p>
                <p id="stat-favorites" class="text-2xl font-bold text-red-400">0</p>
            </div>
        </div>

        <!-- FILTROS E PESQUISA -->
        <div class="flex flex-col sm:flex-row gap-4 mb-8">
            <div class="relative flex-grow">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="Pesquisar obras..." class="w-full bg-brand-card border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:border-brand-accent transition">
            </div>
            <select id="category-filter" class="bg-brand-card border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-accent transition text-slate-300">
                <option value="all">Todas as Categorias</option>
                <option value="anime">Animes</option>
                <option value="manga">Mangás / Curtas</option>
                <option value="dorama">Dramas (Doramas)</option>
                <option value="movie">Filmes</option>
                <option value="book">Livros</option>
                <option value="series">Séries</option>
            </select>
        </div>

        <!-- GRELHA DE OBRAS -->
        <div id="stories-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os cards injetados via JavaScript aparecerão aqui -->
        </div>
    </main>

    <!-- MODAL DE ADICIONAR / EDITAR -->
    <div id="story-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-brand-card border border-slate-800 w-full max-w-2xl rounded-3xl p-6 my-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="font-cinzel text-xl font-bold text-white">Adicionar Nova Obra</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="story-form" class="space-y-4">
                <input type="hidden" id="story-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Título</label>
                        <input type="text" id="form-title" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-accent">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Categoria</label>
                        <select id="form-category" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-accent text-slate-300">
                            <option value="anime">Anime</option>
                            <option value="manga">Mangá / Curta</option>
                            <option value="dorama">Dorama</option>
                            <option value="movie">Filme</option>
                            <option value="book">Livro</option>
                            <option value="series">Série</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Estado</label>
                        <select id="form-status" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-accent text-slate-300">
                            <option value="completed">Concluído</option>
                            <option value="progress">Em Andamento</option>
                            <option value="planned">Planeado</option>
                            <option value="dropped">Abandonado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">URL da Capa (ou upload)</label>
                        <input type="text" id="form-image" placeholder="https://..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-accent">
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Sinopse / Descrição</label>
                    <textarea id="form-synopsis" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-brand-accent resize-none"></textarea>
                </div>

                <!-- CAMPO DO "FAVORITEI" DENTRO DO FORMULÁRIO DE EDIÇÃO/CRIAÇÃO -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2 font-semibold">Marcador de Favorito</label>
                    <div id="modal-favorite-swipe" class="favorite-swipe-track" data-is-favorite="false">
                        <div class="favorite-swipe-text">Deslize para Favoritar</div>
                        <div class="favorite-swipe-thumb">
                            <i class="fa-solid fa-heart text-sm"></i>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand-accent hover:bg-blue-600 text-white text-sm font-medium transition shadow-lg shadow-blue-500/20">Guardar Obra</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE GERENCIAMENTO E DO SWIPE "FAVORITEI" -->
    <script>
        // Função reutilizável do Swipe "Favoritei"
        function initFavoriteSwipe(trackElement, onToggleCallback) {
            let isDragging = false;
            let startX = 0;
            let currentTranslate = 0;
            let maxTranslate = 0;

            const thumb = trackElement.querySelector('.favorite-swipe-thumb');
            const textElement = trackElement.querySelector('.favorite-swipe-text');
            
            let isFav = trackElement.getAttribute('data-is-favorite') === 'true';
            updateVisualState(isFav, false);

            function updateVisualState(favorite, animate = true) {
                if (favorite) {
                    trackElement.classList.add('active-fav');
                    textElement.textContent = 'Favoritado!';
                    if (animate) thumb.style.transform = `translateX(${maxTranslate}px)`;
                } else {
                    trackElement.classList.remove('active-fav');
                    textElement.textContent = 'Deslize para Favoritar';
                    if (animate) thumb.style.transform = `translateX(0px)`;
                }
            }

            function updateDimensions() {
                maxTranslate = trackElement.clientWidth - thumb.clientWidth - 6;
                if (trackElement.getAttribute('data-is-favorite') === 'true') {
                    thumb.style.transform = `translateX(${maxTranslate}px)`;
                }
            }

            window.addEventListener('resize', updateDimensions);
            setTimeout(updateDimensions, 50);

            function dragStart(e) {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                thumb.style.transition = 'none';
            }

            function dragMove(e) {
                if (!isDragging) return;
                const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const diffX = currentX - startX;

                let baseOffset = trackElement.getAttribute('data-is-favorite') === 'true' ? maxTranslate : 0;
                currentTranslate = Math.max(0, Math.min(maxTranslate, baseOffset + diffX));

                thumb.style.transform = `translateX(${currentTranslate}px)`;
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';

                let currentlyFav = trackElement.getAttribute('data-is-favorite') === 'true';
                
                if (currentTranslate > maxTranslate / 2) {
                    isFav = true;
                    trackElement.setAttribute('data-is-favorite', 'true');
                    updateVisualState(true, true);
                } else {
                    isFav = false;
                    trackElement.setAttribute('data-is-favorite', 'false');
                    updateVisualState(false, true);
                }

                if (currentlyFav !== isFav && typeof onToggleCallback === 'function') {
                    onToggleCallback(isFav);
                }
                currentTranslate = isFav ? maxTranslate : 0;
            }

            thumb.addEventListener('mousedown', dragStart);
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            thumb.addEventListener('touchstart', dragStart, { passive: true });
            window.addEventListener('touchmove', dragMove, { passive: true });
            window.addEventListener('touchend', dragEnd);
        }

        // Lógica de Modais e Dados de Exemplo
        function openAddModal() {
            document.getElementById('story-modal').classList.remove('hidden');
            document.getElementById('modal-title').textContent = 'Adicionar Nova Obra';
            document.getElementById('story-form').reset();
            document.getElementById('story-id').value = '';
            
            const swipeEl = document.getElementById('modal-favorite-swipe');
            swipeEl.setAttribute('data-is-favorite', 'false');
            initFavoriteSwipe(swipeEl);
        }

        function closeModal() {
            document.getElementById('story-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modalSwipe = document.getElementById('modal-favorite-swipe');
            if (modalSwipe) {
                initFavoriteSwipe(modalSwipe);
            }
        });
    </script>
</body>
</html>
