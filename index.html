    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { initializeFirestore, persistentLocalCache, collection, addDoc, updateDoc, onSnapshot, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_bk-Qu1vjejNGeGlprEs7isWacxpneTo",
            authDomain: "blue-moon-jscr8785.firebaseapp.com",
            projectId: "blue-moon-jscr8785",
            storageBucket: "blue-moon-jscr8785.firebasestorage.app",
            messagingSenderId: "116253867860",
            appId: "1:116253867860:web:39cfe119f7cb8a7570d2c1"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache()
        });

        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const userInfo = document.getElementById('userInfo');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (loginBtnText) loginBtnText.textContent = 'Sair';
                if(userInfo) {
                    userInfo.style.display = 'inline';
                    userInfo.textContent = `Olá, ${user.displayName ? user.displayName.split(' ')[0] : 'Utilizador'}`;
                }
            } else {
                if (loginBtnText) loginBtnText.textContent = 'Entrar com Google';
                if(userInfo) userInfo.style.display = 'none';
            }
        });

        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                if (auth.currentUser) {
                    await signOut(auth);
                } else {
                    try {
                        await signInWithPopup(auth, provider);
                    } catch (error) {
                        console.error("Erro no login:", error);
                    }
                }
            });
        }

        let mediaItems = [];
        let currentCategory = 'all';
        let currentCardFilter = null; // Filtro dos cards de estatísticas (completed, in-progress, planned, abandoned, favorites)
        let tempCoverBase64 = '';

        // --- CONTROLO DO SWIPE DE FAVORITO NO FORMULÁRIO ---
        let isSwiping = false;
        let startSwipeX = 0;
        let currentSwipeX = 0;

        window.setFavoriteSwipeState = (isFav, triggerAnimation = true) => {
            const track = document.getElementById('modal-favorite-swipe');
            const label = document.getElementById('favorite-swipe-label');
            const thumb = track ? track.querySelector('.favorite-swipe-thumb') : null;
            if (!track || !thumb) return;

            const trackWidth = track.clientWidth || 260;
            const maxTranslate = trackWidth - 44; 

            track.style.setProperty('--track-width', `${trackWidth}px`);

            if (!triggerAnimation) {
                thumb.style.transition = 'none';
            } else {
                thumb.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease';
            }

            if (isFav) {
                track.classList.add('active-fav');
                track.setAttribute('data-is-favorite', 'true');
                if (label) label.textContent = 'Favoritado!';
                thumb.style.transform = `translateX(${maxTranslate}px)`;
            } else {
                track.classList.remove('active-fav');
                track.setAttribute('data-is-favorite', 'false');
                if (label) label.textContent = 'Deslize para Favoritar';
                thumb.style.transform = `translateX(0px)`;
            }
        };

        window.toggleFavoriteSwipe = () => {
            const track = document.getElementById('modal-favorite-swipe');
            if (!track) return;
            const current = track.getAttribute('data-is-favorite') === 'true';
            window.setFavoriteSwipeState(!current, true);
        };

        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('modal-favorite-swipe');
            if (!track) return;

            const thumb = track.querySelector('.favorite-swipe-thumb');
            if (!thumb) return;

            track.addEventListener('pointerdown', (e) => {
                isSwiping = true;
                startSwipeX = e.clientX;
                thumb.style.transition = 'none';
                track.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            track.addEventListener('pointermove', (e) => {
                if (!isSwiping) return;
                const trackWidth = track.clientWidth || 260;
                const maxTranslate = trackWidth - 44;
                
                const diffX = e.clientX - startSwipeX;
                currentSwipeX = Math.max(0, Math.min(diffX, maxTranslate));

                thumb.style.transform = `translateX(${currentSwipeX}px)`;
                
                if (currentSwipeX > maxTranslate / 2) {
                    track.classList.add('active-fav');
                } else {
                    track.classList.remove('active-fav');
                }
            });

            track.addEventListener('pointerup', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                const trackWidth = track.clientWidth || 260;
                const maxTranslate = trackWidth - 44;

                if (currentSwipeX > maxTranslate / 2) {
                    window.setFavoriteSwipeState(true, true);
                } else {
                    window.setFavoriteSwipeState(false, true);
                }
            });

            track.addEventListener('click', () => {
                window.toggleFavoriteSwipe();
            });

            // Iniciar escuta em tempo real do Firestore (substitua "obras" pelo nome exato da sua coleção se for diferente)
            initFirestoreListener();
        });

        function initFirestoreListener() {
            // Nota: certifique-se de que o nome da coleção abaixo ('obras' ou o que você usa) seja o mesmo do seu banco
            onSnapshot(collection(db, "obras"), (snapshot) => {
                mediaItems = [];
                snapshot.forEach((docSnap) => {
                    mediaItems.push({ id: docSnap.id, ...docSnap.data() });
                });
                updateStats();
                window.renderMediaGrid();
            }, (error) => {
                console.error("Erro ao carregar do Firestore:", error);
            });
        }

        function updateStats() {
            const total = mediaItems.length;
            const completed = mediaItems.filter(i => i.status === 'completed').length;
            const inProgress = mediaItems.filter(i => i.status === 'in-progress').length;
            const planned = mediaItems.filter(i => i.status === 'planned').length;
            const abandoned = mediaItems.filter(i => i.status === 'abandoned').length;
            const favorites = mediaItems.filter(i => i.favorite === true).length;

            if(document.getElementById('stat-acervo')) document.getElementById('stat-acervo').textContent = total;
            if(document.getElementById('stat-completed')) document.getElementById('stat-completed').textContent = completed;
            if(document.getElementById('stat-in-progress')) document.getElementById('stat-in-progress').textContent = inProgress;
            if(document.getElementById('stat-planned')) document.getElementById('stat-planned').textContent = planned;
            if(document.getElementById('stat-abandoned')) document.getElementById('stat-abandoned').textContent = abandoned;
            if(document.getElementById('stat-favorites')) document.getElementById('stat-favorites').textContent = favorites;

            // Atualizar badges do menu lateral
            if(document.getElementById('badge-all')) document.getElementById('badge-all').textContent = total;
            if(document.getElementById('badge-favorites')) document.getElementById('badge-favorites').textContent = favorites;
            
            ['anime', 'short', 'dorama', 'movie', 'book', 'series'].forEach(cat => {
                const count = mediaItems.filter(i => i.category === cat).length;
                const badge = document.getElementById(`badge-${cat}`);
                if(badge) badge.textContent = count;
            });
        }

        window.openSidebar = () => {
            document.getElementById('sidebar-drawer').classList.remove('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.remove('hidden');
        };

        window.closeSidebar = () => {
            document.getElementById('sidebar-drawer').classList.add('-translate-x-full');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
        };

        window.switchCategory = (category) => {
            currentCategory = category;
            currentCardFilter = null;
            document.getElementById('filter-results-container').classList.add('hidden');
            window.closeSidebar();
            window.renderMediaGrid();
        };

        window.filterStoriesCard = (filterType) => {
            if (filterType === 'all') {
                currentCardFilter = null;
                document.getElementById('filter-results-container').classList.add('hidden');
                window.renderMediaGrid();
                return;
            }
            currentCardFilter = filterType;
            const container = document.getElementById('filter-results-container');
            const grid = document.getElementById('filter-results-grid');
            const titleText = document.getElementById('filter-title-text');
            
            let filtered = [];
            let label = '';
            if (filterType === 'completed') { label = 'Obras Concluídas'; filtered = mediaItems.filter(i => i.status === 'completed'); }
            else if (filterType === 'in-progress') { label = 'Obras Em Andamento'; filtered = mediaItems.filter(i => i.status === 'in-progress'); }
            else if (filterType === 'planned') { label = 'Quero Ver / Ler'; filtered = mediaItems.filter(i => i.status === 'planned'); }
            else if (filterType === 'abandoned') { label = 'Obras Abandonadas'; filtered = mediaItems.filter(i => i.status === 'abandoned'); }
            else if (filterType === 'favorites') { label = 'Obras Favoritas'; filtered = mediaItems.filter(i => i.favorite === true); }

            titleText.textContent = label;
            container.classList.remove('hidden');

            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-xs text-blue-300/70 py-6">Nenhum registo encontrado nesta categoria.</p>`;
                return;
            }

            filtered.forEach(item => {
                grid.appendChild(createMediaCardElement(item));
            });
        };

        window.closeFilterResults = () => {
            document.getElementById('filter-results-container').classList.add('hidden');
            currentCardFilter = null;
        };

        function createMediaCardElement(item) {
            const card = document.createElement('div');
            card.className = 'glass-card rounded-xl overflow-hidden flex flex-col cursor-pointer hover:border-blue-400 transition shadow-lg group relative';
            card.onclick = () => window.openDetailsModal(item.id);

            const coverUrl = item.cover || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?q=80&w=600&auto=format&fit=crop';
            
            card.innerHTML = `
                <div class="relative aspect-[3/4] w-full bg-blue-950/50 overflow-hidden">
                    <img src="${coverUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    ${item.favorite ? '<span class="absolute top-2 right-2 w-7 h-7 bg-rose-500/80 backdrop-blur-md rounded-full flex items-center justify-center text-white text-xs shadow-md"><i class="fa-solid fa-heart"></i></span>' : ''}
                    ${item.rating ? `<span class="absolute bottom-2 left-2 bg-black/60 backdrop-blur-md text-amber-400 text-[10px] font-bold px-2 py-0.5 rounded-md flex items-center space-x-1"><span>★</span><span>${item.rating}</span></span>` : ''}
                </div>
                <div class="p-2.5 flex flex-col flex-1 justify-between">
                    <h4 class="text-xs font-bold text-white line-clamp-1">${item.title}</h4>
                    <span class="text-[10px] text-blue-300/70 uppercase mt-1">${item.category || 'geral'}</span>
                </div>
            `;
            return card;
        }

        window.renderMediaGrid = () => {
            const grid = document.getElementById('media-grid');
            const emptyState = document.getElementById('empty-state');
            const searchInput = document.getElementById('search-input');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

            grid.innerHTML = '';

            let filtered = mediaItems.filter(item => {
                const matchesCategory = currentCategory === 'all' || 
                    (currentCategory === 'favorites' ? item.favorite === true : item.category === currentCategory);
                const matchesSearch = item.title && item.title.toLowerCase().includes(searchTerm);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    grid.appendChild(createMediaCardElement(item));
                });
            }
        };

        window.openAddModal = () => {
            document.getElementById('modal-add-edit').classList.remove('hidden');
            window.setFavoriteSwipeState(false, false);
        };

        window.closeAddModal = () => {
            document.getElementById('modal-add-edit').classList.add('hidden');
        };

        window.openBannerModal = () => {
            document.getElementById('modal-banner').classList.remove('hidden');
        };

        window.closeBannerModal = () => {
            document.getElementById('modal-banner').classList.add('hidden');
        };

        window.openDetailsModal = async (id) => {
            const item = mediaItems.find(i => i.id === id);
            if (!item) return;

            const content = document.getElementById('details-content');
            content.innerHTML = `
                <div class="flex space-x-4">
                    <img src="${item.cover || ''}" class="w-28 h-40 object-cover rounded-xl border border-blue-500/30" />
                    <div class="space-y-1 flex-1">
                        <h4 class="text-base font-bold text-white">${item.title}</h4>
                        ${item.originalTitle ? `<p class="text-xs text-blue-300/70">Original: ${item.originalTitle}</p>` : ''}
                        <p class="text-xs text-blue-200 mt-2"><strong class="text-white">Categoria:</strong> ${item.category}</p>
                        <p class="text-xs text-blue-200"><strong class="text-white">Status:</strong> ${item.status}</p>
                        ${item.rating ? `<p class="text-xs text-amber-400 font-semibold mt-1">★ ${item.rating}/10</p>` : ''}
                    </div>
                </div>
                ${item.synopsis ? `<div><h5 class="text-xs font-bold text-blue-300 uppercase mb-1">Sinopse</h5><p class="text-xs text-gray-300 bg-[#0e1738]/50 p-3 rounded-xl">${item.synopsis}</p></div>` : ''}
                ${item.review ? `<div><h5 class="text-xs font-bold text-blue-300 uppercase mb-1">Resenha</h5><p class="text-xs text-gray-300 bg-[#0e1738]/50 p-3 rounded-xl">${item.review}</p></div>` : ''}
                <div class="flex justify-end space-x-2 pt-3 border-t border-blue-900/40">
                    <button type="button" onclick="window.deleteMedia('${item.id}')" class="px-3 py-1.5 bg-rose-600/30 hover:bg-rose-600 text-rose-200 hover:text-white text-xs font-semibold rounded-xl transition cursor-pointer">Eliminar</button>
                    <button type="button" onclick="window.closeDetailsModal()" class="px-3 py-1.5 bg-blue-950/60 text-gray-200 text-xs font-semibold rounded-xl cursor-pointer">Fechar</button>
                </div>
            `;
            document.getElementById('modal-details').classList.remove('hidden');
        };

        window.closeDetailsModal = () => {
            document.getElementById('modal-details').classList.add('hidden');
        };

        window.deleteMedia = async (id) => {
            if (confirm("Tem certeza que deseja eliminar esta obra?")) {
                try {
                    await deleteDoc(doc(db, "obras", id));
                    window.closeDetailsModal();
                } catch (error) {
                    console.error("Erro ao eliminar:", error);
                }
            }
        };

        window.saveMedia = async (e) => {
            e.preventDefault();
            const title = document.getElementById('form-title').value;
            const category = document.getElementById('form-category').value;
            const status = document.getElementById('form-status').value;
            const synopsis = document.getElementById('form-synopsis').value;
            const review = document.getElementById('form-review').value;
            const rating = parseFloat(document.getElementById('form-rating').value) || null;
            const cover = document.getElementById('form-cover-url').value || tempCoverBase64;
            const favorite = document.getElementById('modal-favorite-swipe').getAttribute('data-is-favorite') === 'true';

            const newDocData = { title, category, status, synopsis, review, rating, cover, favorite, createdAt: new Date().toISOString() };

            try {
                await addDoc(collection(db, "obras"), newDocData);
                window.closeAddModal();
                document.getElementById('media-form').reset();
                tempCoverBase64 = '';
            } catch (error) {
                console.error("Erro ao salvar obra:", error);
            }
        };
    </script>
