<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue-Moon | Sanctuary of Stories</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#131C31',
                            accent: '#3B82F6',
                            glow: '#60A5FA'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos personalizados para o Swipe de Coração ("Favoritei") */
        .favorite-swipe-track {
            position: relative;
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            touch-action: none;
        }
        .favorite-swipe-track.active-fav {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
        }
        .favorite-swipe-thumb {
            position: absolute;
            left: 4px;
            width: 40px;
            height: 40px;
            background: #1f2937;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9ca3af;
            cursor: grab;
            transition: background 0.2s, color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }
        .favorite-swipe-track.active-fav .favorite-swipe-thumb {
            background: #ef4444;
            color: #ffffff;
        }
        .favorite-swipe-thumb:active {
            cursor: grabbing;
        }
        .favorite-swipe-text {
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: #9ca3af;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            pointer-events: none;
        }
        .favorite-swipe-track.active-fav .favorite-swipe-text {
            color: #fca5a5;
        }
    </style>
</head>
<body class="bg-brand-dark text-slate-100 font-sans min-h-screen flex flex-col selection:bg-brand-accent selection:text-white">

    <!-- HEADER / BARRA DE AUTENTICAÇÃO -->
    <header class="border-b border-slate-800 bg-brand-dark/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-moon text-brand-glow text-2xl"></i>
                <h1 class="font-cinzel font-bold text-xl tracking-wider bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">Blue-Moon</h1>
            </div>
            <div id="auth-container" class="flex items-center space-x-4">
                <span id="user-greeting" class="text-sm text-slate-300 hidden">Olá, <span id="user-name" class="font-semibold text-white"></span></span>
                <button id="auth-btn" class="bg-brand-accent hover:bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition shadow-lg shadow-blue-500/20">
                    <i class="fa-brands fa-google mr-2"></i>Entrar com Google
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="mb-8">
            <h2 class="text-3xl font-cinzel font-bold mb-2">Santuário de Histórias</h2>
            <p class="text-slate-400 text-sm">Gerencie o seu acervo pessoal com o novo sistema interativo de deslize.</p>
        </div>

        <!-- EXEMPLO DE INTEGRAÇÃO DO COMPONENTE "FAVORITEI" NO MODAL / CARTÃO -->
        <div class="bg-brand-card border border-slate-800 rounded-2xl p-6 max-w-md shadow-xl">
            <h3 class="font-cinzel text-lg font-bold mb-4 text-slate-200">Exemplo de Ação "Favoritei"</h3>
            <p class="text-sm text-slate-400 mb-6">Arraste o botão de coração para a direita para marcar esta obra como favorita.</p>
            
            <!-- Componente Swipe "Favoritei" -->
            <div id="demo-favorite-swipe" class="favorite-swipe-track" data-is-favorite="false">
                <div class="favorite-swipe-text">Deslize para Favoritar</div>
                <div class="favorite-swipe-thumb">
                    <i class="fa-solid fa-heart text-sm"></i>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT DE LÓGICA DO SWIPE "FAVORITEI" -->
    <script>
        function initFavoriteSwipe(trackElement, onToggleCallback) {
            let isDragging = false;
            let startX = 0;
            let currentTranslate = 0;
            let maxTranslate = 0;

            const thumb = trackElement.querySelector('.favorite-swipe-thumb');
            const textElement = trackElement.querySelector('.favorite-swipe-text');
            
            // Estado Inicial baseado no atributo
            let isFav = trackElement.getAttribute('data-is-favorite') === 'true';
            updateVisualState(isFav, false);

            function updateVisualState(favorite, animate = true) {
                if (favorite) {
                    trackElement.classList.add('active-fav');
                    textElement.textContent = 'Favoritado!';
                    if (animate) thumb.style.transform = `translateX(${maxTranslate}px)`;
                } else {
                    trackElement.classList.remove('active-fav');
                    textElement.textContent = 'Deslize para Favoritar';
                    if (animate) thumb.style.transform = `translateX(0px)`;
                }
            }

            // Recalcula o espaço máximo de arraste
            function updateDimensions() {
                maxTranslate = trackElement.clientWidth - thumb.clientWidth - 8; // considerando o padding
                if (trackElement.getAttribute('data-is-favorite') === 'true') {
                    thumb.style.transform = `translateX(${maxTranslate}px)`;
                }
            }

            window.addEventListener('resize', updateDimensions);
            setTimeout(updateDimensions, 50);

            // Eventos de Mouse e Toque
            function dragStart(e) {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                thumb.style.transition = 'none';
            }

            function dragMove(e) {
                if (!isDragging) return;
                const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const diffX = currentX - startX;

                let baseOffset = trackElement.getAttribute('data-is-favorite') === 'true' ? maxTranslate : 0;
                currentTranslate = Math.max(0, Math.min(maxTranslate, baseOffset + diffX));

                thumb.style.transform = `translateX(${currentTranslate}px)`;
            }

            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                thumb.style.transition = 'transform 0.3s cubic-bezier(0.4, 0, 0.2, 1)';

                let currentlyFav = trackElement.getAttribute('data-is-favorite') === 'true';
                
                // Se arrastou mais de 50% do caminho, alterna o estado
                if (currentTranslate > maxTranslate / 2) {
                    isFav = true;
                    trackElement.setAttribute('data-is-favorite', 'true');
                    updateVisualState(true, true);
                } else {
                    isFav = false;
                    trackElement.setAttribute('data-is-favorite', 'false');
                    updateVisualState(false, true);
                }

                if (currentlyFav !== isFav && typeof onToggleCallback === 'function') {
                    onToggleCallback(isFav);
                }
                currentTranslate = isFav ? maxTranslate : 0;
            }

            thumb.addEventListener('mousedown', dragStart);
            window.addEventListener('mousemove', dragMove);
            window.addEventListener('mouseup', dragEnd);

            thumb.addEventListener('touchstart', dragStart, { passive: true });
            window.addEventListener('touchmove', dragMove, { passive: true });
            window.addEventListener('touchend', dragEnd);
        }

        // Inicialização do componente de demonstração
        document.addEventListener('DOMContentLoaded', () => {
            const demoSwipe = document.getElementById('demo-favorite-swipe');
            if (demoSwipe) {
                initFavoriteSwipe(demoSwipe, (isFavorite) => {
                    console.log("Estado do favorito alterado:", isFavorite);
                    // Aqui pode colocar a lógica para atualizar o Firebase ou o estado global da obra
                });
            }
        });
    </script>
</body>
</html>
